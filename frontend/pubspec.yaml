name: assignment
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.13.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Core & State Management (BLoC / Provider)
  flutter_bloc: ^8.1.3
  equatable: ^2.0.5

  # Camera & QR Scanner
  mobile_scanner: ^3.5.5
  qr_flutter: ^4.1.0

  # Local Database & Cache (Offline sync)
  sqflite: ^2.3.0
  sqflite_common_ffi: ^2.3.0
  path: ^1.8.3
  shared_preferences: ^2.2.2

  # Network & Backend
  http: ^1.1.0
  firebase_core: ^3.6.0
  firebase_messaging: ^15.1.3

  # UI / Charts / Utils
  fl_chart: ^0.66.0
  intl: ^0.19.0
  flutter_dotenv: ^6.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  bloc_test: ^9.1.5

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - .env
