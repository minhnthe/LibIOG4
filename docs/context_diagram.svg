<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1350 960" width="100%" height="100%" style="background:#ffffff; font-family:'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <!-- Drop Shadow Filters -->
    <filter id="shadow-main" x="-10%" y="-10%" width="120%" height="125%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="2" dy="5" stdDeviation="5" flood-color="#0f172a" flood-opacity="0.15"/>
    </filter>
    <filter id="shadow-node" x="-8%" y="-8%" width="116%" height="120%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="1" dy="3" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>

    <!-- Arrow Markers -->
    <marker id="arrow-in" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#2563EB"/>
    </marker>
    <marker id="arrow-out" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#059669"/>
    </marker>
    <marker id="arrow-admin" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#D97706"/>
    </marker>
    <marker id="arrow-gate" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#7C3AED"/>
    </marker>
  </defs>

  <!-- Canvas Background -->
  <rect width="100%" height="100%" fill="#F8FAFC"/>

  <!-- ================= HEADER BANNER ================= -->
  <g transform="translate(40, 24)">
    <rect width="1270" height="54" rx="8" fill="#1E293B"/>
    <text x="24" y="34" fill="#F8FAFC" font-size="17" font-weight="700" letter-spacing="0.5">SƠ ĐỒ NGỮ CẢNH HỆ THỐNG (SYSTEM CONTEXT DIAGRAM / DFD LEVEL 0)</text>
    <text x="790" y="34" fill="#94A3B8" font-size="13" font-weight="500">Tài liệu Đặc tả Yêu cầu SRS • Hệ thống Ra Vào Thư Viện LibIOG4</text>
  </g>

  <!-- ================= CONNECTING DATA FLOW LINES ================= -->

  <!-- ====== 1. SINH VIÊN (LEFT) <-> HỆ THỐNG (CENTER) ====== -->
  <g fill="none">
    <!-- Student -> System (Inputs) -->
    <!-- Top Flow: Đăng ký & Đăng nhập -->
    <path d="M 280 280 C 390 280, 420 420, 500 420" stroke="#2563EB" stroke-width="2" marker-end="url(#arrow-in)"/>
    <!-- Mid Flow: Xuất trình QR / Yêu cầu Thẻ SV điện tử -->
    <path d="M 280 340 C 380 340, 410 460, 500 460" stroke="#2563EB" stroke-width="2" marker-end="url(#arrow-in)"/>
    <!-- Bot Flow: Yêu cầu Tra cứu lịch sử & Đổi mật khẩu -->
    <path d="M 280 400 C 370 400, 410 500, 500 500" stroke="#2563EB" stroke-width="2" marker-end="url(#arrow-in)"/>

    <!-- System -> Student (Outputs) -->
    <!-- Top Flow: JWT Token & Phân quyền -->
    <path d="M 500 440 C 430 440, 390 310, 280 310" stroke="#059669" stroke-width="2" stroke-dasharray="6,3" marker-end="url(#arrow-out)"/>
    <!-- Mid Flow: Thẻ điện tử & Live Badge (Inside/Outside) -->
    <path d="M 500 480 C 420 480, 380 370, 280 370" stroke="#059669" stroke-width="2" stroke-dasharray="6,3" marker-end="url(#arrow-out)"/>
    <!-- Bot Flow: Lịch sử ra vào & Thông báo (Check-in/Đóng cửa) -->
    <path d="M 500 520 C 410 520, 370 430, 280 430" stroke="#059669" stroke-width="2" stroke-dasharray="6,3" marker-end="url(#arrow-out)"/>
  </g>

  <!-- Data Flow Labels for Student -->
  <g font-size="10.5" font-weight="600">
    <!-- Input labels -->
    <rect x="330" y="325" width="135" height="18" rx="3" fill="#EFF6FF" stroke="#BFDBFE"/>
    <text x="335" y="338" fill="#1D4ED8">Thông tin ĐK / Đăng nhập</text>

    <rect x="335" y="405" width="130" height="18" rx="3" fill="#EFF6FF" stroke="#BFDBFE"/>
    <text x="340" y="418" fill="#1D4ED8">Xuất trình Mã QR cá nhân</text>

    <rect x="330" y="485" width="140" height="18" rx="3" fill="#EFF6FF" stroke="#BFDBFE"/>
    <text x="335" y="498" fill="#1D4ED8">Y/c Tra cứu LS &amp; Đổi pass</text>

    <!-- Output labels -->
    <rect x="330" y="285" width="140" height="18" rx="3" fill="#ECFDF5" stroke="#A7F3D0"/>
    <text x="335" y="298" fill="#047857">JWT Auth Token &amp; Quyền</text>

    <rect x="340" y="365" width="130" height="18" rx="3" fill="#ECFDF5" stroke="#A7F3D0"/>
    <text x="345" y="378" fill="#047857">Thẻ SV &amp; Live Badge Vị trí</text>

    <rect x="330" y="445" width="145" height="18" rx="3" fill="#ECFDF5" stroke="#A7F3D0"/>
    <text x="335" y="458" fill="#047857">Nhật ký điểm danh &amp; Báo giờ</text>
  </g>


  <!-- ====== 2. THỦ THƯ (RIGHT TOP) <-> HỆ THỐNG (CENTER) ====== -->
  <g fill="none">
    <!-- Librarian -> System (Inputs) -->
    <path d="M 1070 230 C 960 230, 920 390, 850 410" stroke="#2563EB" stroke-width="2" marker-end="url(#arrow-in)"/>
    <path d="M 1070 290 C 970 290, 930 450, 850 450" stroke="#2563EB" stroke-width="2" marker-end="url(#arrow-in)"/>
    <path d="M 1070 350 C 970 350, 930 490, 850 490" stroke="#2563EB" stroke-width="2" marker-end="url(#arrow-in)"/>

    <!-- System -> Librarian (Outputs) -->
    <path d="M 850 430 C 930 430, 970 260, 1070 260" stroke="#059669" stroke-width="2" stroke-dasharray="6,3" marker-end="url(#arrow-out)"/>
    <path d="M 850 470 C 930 470, 980 320, 1070 320" stroke="#059669" stroke-width="2" stroke-dasharray="6,3" marker-end="url(#arrow-out)"/>
    <path d="M 850 510 C 920 510, 970 380, 1070 380" stroke="#059669" stroke-width="2" stroke-dasharray="6,3" marker-end="url(#arrow-out)"/>
  </g>

  <!-- Data Flow Labels for Librarian -->
  <g font-size="10.5" font-weight="600">
    <!-- Input labels -->
    <rect x="880" y="275" width="150" height="18" rx="3" fill="#EFF6FF" stroke="#BFDBFE"/>
    <text x="885" y="288" fill="#1D4ED8">Dữ liệu quét QR / MSSV tay</text>

    <rect x="885" y="345" width="140" height="18" rx="3" fill="#EFF6FF" stroke="#BFDBFE"/>
    <text x="890" y="358" fill="#1D4ED8">Lệnh Khóa / Mở khóa thẻ</text>

    <rect x="875" y="420" width="155" height="18" rx="3" fill="#EFF6FF" stroke="#BFDBFE"/>
    <text x="880" y="433" fill="#1D4ED8">Cưỡng chế Out &amp; Đồng bộ Sync</text>

    <!-- Output labels -->
    <rect x="880" y="235" width="145" height="18" rx="3" fill="#ECFDF5" stroke="#A7F3D0"/>
    <text x="885" y="248" fill="#047857">Kết quả Điểm danh tức thì</text>

    <rect x="885" y="310" width="145" height="18" rx="3" fill="#ECFDF5" stroke="#A7F3D0"/>
    <text x="890" y="323" fill="#047857">Live Occupancy &amp; Danh sách</text>

    <rect x="875" y="385" width="155" height="18" rx="3" fill="#ECFDF5" stroke="#A7F3D0"/>
    <text x="880" y="398" fill="#047857">Biểu đồ thống kê &amp; Báo cáo CSV</text>
  </g>


  <!-- ====== 3. QUẢN TRỊ VIÊN (RIGHT BOTTOM) <-> HỆ THỐNG (CENTER) ====== -->
  <g fill="none">
    <!-- Admin -> System (Inputs) -->
    <path d="M 1070 650 C 970 650, 930 550, 850 530" stroke="#D97706" stroke-width="2" marker-end="url(#arrow-admin)"/>
    <path d="M 1070 710 C 970 710, 920 580, 850 560" stroke="#D97706" stroke-width="2" marker-end="url(#arrow-admin)"/>

    <!-- System -> Admin (Outputs) -->
    <path d="M 850 545 C 925 545, 965 680, 1070 680" stroke="#059669" stroke-width="2" stroke-dasharray="6,3" marker-end="url(#arrow-out)"/>
    <path d="M 850 575 C 920 575, 960 740, 1070 740" stroke="#059669" stroke-width="2" stroke-dasharray="6,3" marker-end="url(#arrow-out)"/>
  </g>

  <!-- Data Flow Labels for Admin -->
  <g font-size="10.5" font-weight="600">
    <rect x="880" y="585" width="155" height="18" rx="3" fill="#FFFBEB" stroke="#FDE68A"/>
    <text x="885" y="598" fill="#B45309">Phân quyền Role &amp; Xóa mềm</text>

    <rect x="875" y="660" width="165" height="18" rx="3" fill="#FFFBEB" stroke="#FDE68A"/>
    <text x="880" y="673" fill="#B45309">Cấu hình Sức chứa, Giờ mở/đóng</text>

    <rect x="875" y="725" width="160" height="18" rx="3" fill="#ECFDF5" stroke="#A7F3D0"/>
    <text x="880" y="738" fill="#047857">Trạng thái cấu hình nóng tức thì</text>

    <rect x="880" y="625" width="150" height="18" rx="3" fill="#ECFDF5" stroke="#A7F3D0"/>
    <text x="885" y="638" fill="#047857">Báo cáo quản trị toàn hệ thống</text>
  </g>


  <!-- ====== 4. TRẠM QUÉT / PHẦN CỨNG CỔNG (BOTTOM) <-> HỆ THỐNG (CENTER) ====== -->
  <g fill="none">
    <!-- Gate -> System -->
    <path d="M 640 760 C 640 680, 640 640, 640 590" stroke="#7C3AED" stroke-width="2" marker-end="url(#arrow-gate)"/>
    <!-- System -> Gate -->
    <path d="M 710 590 C 710 640, 710 680, 710 760" stroke="#059669" stroke-width="2" stroke-dasharray="6,3" marker-end="url(#arrow-out)"/>
  </g>

  <!-- Data Flow Labels for Gate Hardware -->
  <g font-size="10.5" font-weight="600">
    <rect x="500" y="665" width="135" height="20" rx="3" fill="#F5F3FF" stroke="#DDD6FE"/>
    <text x="506" y="679" fill="#6D28D9">Mã quét QR / Gate ID</text>

    <rect x="715" y="665" width="145" height="20" rx="3" fill="#ECFDF5" stroke="#A7F3D0"/>
    <text x="720" y="679" fill="#047857">Tín hiệu mở cổng / Đèn còi</text>
  </g>


  <!-- ================= CENTRAL SYSTEM (PROCESS 0.0) ================= -->
  <g transform="translate(500, 390)" filter="url(#shadow-main)">
    <!-- Double border box for Context Process 0 -->
    <rect width="350" height="200" rx="16" fill="#1E293B" stroke="#38BDF8" stroke-width="2.5"/>
    <rect x="6" y="6" width="338" height="188" rx="12" fill="none" stroke="#475569" stroke-width="1.2" stroke-dasharray="4,3"/>

    <!-- Process ID -->
    <rect x="20" y="16" width="48" height="22" rx="4" fill="#0284C7"/>
    <text x="29" y="31" fill="#FFFFFF" font-size="11" font-weight="700">0.0</text>

    <text x="76" y="32" fill="#38BDF8" font-size="12" font-weight="700" letter-spacing="1">HỆ THỐNG TRUNG TÂM</text>

    <!-- Main Title -->
    <text x="20" y="68" fill="#FFFFFF" font-size="17" font-weight="700">HỆ THỐNG GHI NHẬN</text>
    <text x="20" y="92" fill="#FFFFFF" font-size="17" font-weight="700">RA VÀO THƯ VIỆN</text>
    <text x="20" y="112" fill="#94A3B8" font-size="12" font-weight="600">(LibIOG4 Access Management)</text>

    <!-- Sub description tags -->
    <line x1="20" y1="124" x2="330" y2="124" stroke="#334155" stroke-width="1"/>

    <g transform="translate(20, 134)" font-size="10.5" fill="#CBD5E1">
      <text x="0" y="12">• Node.js REST API Server (JWT, RBAC)</text>
      <text x="0" y="30">• Access Control Engine &amp; Dynamic Config</text>
      <text x="0" y="48">• Real-time Occupancy &amp; Offline Sync Hub</text>
    </g>
  </g>


  <!-- ================= EXTERNAL ENTITIES (TERMINATORS) ================= -->

  <!-- 1. SINH VIÊN (STUDENT) -->
  <g transform="translate(40, 240)" filter="url(#shadow-node)">
    <rect width="240" height="210" rx="10" fill="#FFFFFF" stroke="#4F46E5" stroke-width="2"/>
    <rect x="0" y="0" width="240" height="38" rx="8" fill="#EEF2FF"/>
    <text x="16" y="24" fill="#4338CA" font-size="13" font-weight="700">👤 SINH VIÊN (Student)</text>

    <g transform="translate(16, 52)" font-size="11" fill="#334155">
      <text x="0" y="14" font-weight="600" fill="#475569">Vai trò trong hệ thống:</text>
      <text x="0" y="32">• Độc giả thư viện FPT</text>
      <text x="0" y="48">• Sở hữu Thẻ SV điện tử</text>
      <text x="0" y="64">• Quét QR tại trạm cổng</text>
      <text x="0" y="80">• Xem lịch sử &amp; giờ tự học</text>

      <line x1="0" y1="94" x2="208" y2="94" stroke="#E2E8F0" stroke-width="1"/>
      <text x="0" y="110" font-weight="600" fill="#64748B">Kênh tiếp cận:</text>
      <text x="0" y="126" fill="#2563EB" font-weight="600">Ứng dụng Flutter Mobile App</text>
      <text x="0" y="142" fill="#64748B">(Android / iOS)</text>
    </g>
  </g>

  <!-- 2. THỦ THƯ (LIBRARIAN) -->
  <g transform="translate(1070, 190)" filter="url(#shadow-node)">
    <rect width="240" height="210" rx="10" fill="#FFFFFF" stroke="#059669" stroke-width="2"/>
    <rect x="0" y="0" width="240" height="38" rx="8" fill="#ECFDF5"/>
    <text x="16" y="24" fill="#065F46" font-size="13" font-weight="700">🧑‍💼 THỦ THƯ (Librarian)</text>

    <g transform="translate(16, 52)" font-size="11" fill="#334155">
      <text x="0" y="14" font-weight="600" fill="#475569">Vai trò trong hệ thống:</text>
      <text x="0" y="32">• Vận hành trạm quét thẻ</text>
      <text x="0" y="48">• Giám sát sức chứa realtime</text>
      <text x="0" y="64">• Khóa / Mở khóa thẻ vi phạm</text>
      <text x="0" y="80">• Xem thống kê &amp; Xuất CSV</text>

      <line x1="0" y1="94" x2="208" y2="94" stroke="#E2E8F0" stroke-width="1"/>
      <text x="0" y="110" font-weight="600" fill="#64748B">Kênh tiếp cận:</text>
      <text x="0" y="126" fill="#059669" font-weight="600">Trạm Quầy Web / Desktop / Tab</text>
      <text x="0" y="142" fill="#64748B">(Flutter Web &amp; Windows FFI)</text>
    </g>
  </g>

  <!-- 3. QUẢN TRỊ VIÊN (ADMIN) -->
  <g transform="translate(1070, 600)" filter="url(#shadow-node)">
    <rect width="240" height="210" rx="10" fill="#FFFFFF" stroke="#D97706" stroke-width="2"/>
    <rect x="0" y="0" width="240" height="38" rx="8" fill="#FFFBEB"/>
    <text x="16" y="24" fill="#92400E" font-size="13" font-weight="700">👨‍💻 QUẢN TRỊ VIÊN (Admin)</text>

    <g transform="translate(16, 52)" font-size="11" fill="#334155">
      <text x="0" y="14" font-weight="600" fill="#475569">Vai trò trong hệ thống:</text>
      <text x="0" y="32">• Kế thừa quyền Thủ thư</text>
      <text x="0" y="48">• Quản lý thành viên &amp; Phân Role</text>
      <text x="0" y="64">• Cấu hình Sức chứa / Giờ mở</text>
      <text x="0" y="80">• Bật bảo trì Zero-downtime</text>

      <line x1="0" y1="94" x2="208" y2="94" stroke="#E2E8F0" stroke-width="1"/>
      <text x="0" y="110" font-weight="600" fill="#64748B">Kênh tiếp cận:</text>
      <text x="0" y="126" fill="#D97706" font-weight="600">Admin Console Dashboard</text>
      <text x="0" y="142" fill="#64748B">(Flutter Web / Desktop)</text>
    </g>
  </g>

  <!-- 4. TRẠM QUÉT / CỔNG KIỂM SOÁT (HARDWARE / GATE) -->
  <g transform="translate(525, 760)" filter="url(#shadow-node)">
    <rect width="300" height="120" rx="10" fill="#FFFFFF" stroke="#7C3AED" stroke-width="2"/>
    <rect x="0" y="0" width="300" height="34" rx="8" fill="#F5F3FF"/>
    <text x="16" y="22" fill="#5B21B6" font-size="12.5" font-weight="700">🚧 TRẠM CỔNG / CAMERA QUÉT (Gate Hardware)</text>

    <g transform="translate(16, 44)" font-size="10.5" fill="#334155">
      <text x="0" y="14">• Camera quét mã vạch / QR 2D định dạng chuỗi mã hóa</text>
      <text x="0" y="32">• Cổng kiểm soát Barrier / Turnstile phân làn vào ra</text>
      <text x="0" y="50">• Còi buzzer &amp; Đèn LED báo hiệu (Xanh: Mời vào / Đỏ: Từ chối)</text>
      <text x="0" y="68" fill="#7C3AED" font-weight="600">Vị trí: Cổng chính Tầng 1 (Sảnh Alpha) / Cổng phụ Tầng 2</text>
    </g>
  </g>

  <!-- ================= FOOTER / LEGEND ================= -->
  <g transform="translate(40, 905)">
    <rect width="1270" height="38" rx="6" fill="#F1F5F9" stroke="#E2E8F0"/>
    <text x="16" y="24" fill="#475569" font-size="11.5" font-weight="700">QUY ƯỚC DFD LEVEL 0:</text>

    <!-- Solid line -->
    <line x1="170" y1="19" x2="205" y2="19" stroke="#2563EB" stroke-width="2"/>
    <polygon points="205,16 213,19 205,22" fill="#2563EB"/>
    <text x="220" y="23" fill="#1E293B" font-size="11" font-weight="600">Dữ liệu đầu vào (Input Flow)</text>

    <!-- Dashed line -->
    <line x1="390" y1="19" x2="425" y2="19" stroke="#059669" stroke-width="2" stroke-dasharray="5,3"/>
    <polygon points="425,16 433,19 425,22" fill="#059669"/>
    <text x="440" y="23" fill="#1E293B" font-size="11" font-weight="600">Dữ liệu phản hồi (Output Flow)</text>

    <!-- Entities -->
    <rect x="630" y="10" width="16" height="16" rx="3" fill="#FFFFFF" stroke="#0F172A" stroke-width="1.5"/>
    <text x="655" y="23" fill="#1E293B" font-size="11" font-weight="600">Tác nhân ngoài (External Entity)</text>

    <rect x="850" y="10" width="16" height="16" rx="3" fill="#1E293B"/>
    <text x="875" y="23" fill="#1E293B" font-size="11" font-weight="600">Hệ thống xử lý (0.0 Process)</text>

    <text x="1080" y="23" fill="#94A3B8" font-size="11" font-style="italic">Chuẩn IEEE 830 • Tương thích chèn Word/PDF</text>
  </g>
</svg>
